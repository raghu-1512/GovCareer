    // --- ELIGIBILITY EVALUATION ENGINE ---
    function evaluateEligibility(profile, job) {
      let score = 0;
      const reasons = [];
      const warnings = [];

      // 1. Age Calculation
      let userAge = 24;
      if (profile.dateOfBirth) {
        const birthDate = new Date(profile.dateOfBirth);
        const refDate = new Date('2026-08-01');
        let calculatedAge = refDate.getFullYear() - birthDate.getFullYear();
        const m = refDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && refDate.getDate() < birthDate.getDate())) {
          calculatedAge--;
        }
        userAge = calculatedAge;
      }

      let maxAgeAllowed = job.maxAge;
      let relaxationYears = 0;
      if (profile.category === 'OBC') relaxationYears = job.ageRelaxation?.obc || 3;
      else if (profile.category === 'SC' || profile.category === 'ST') relaxationYears = job.ageRelaxation?.scSt || 5;
      else if (profile.category === 'PwD') relaxationYears = job.ageRelaxation?.pwd || 10;
      maxAgeAllowed += relaxationYears;

      let ageEligible = false;
      if (userAge >= job.minAge && userAge <= maxAgeAllowed) {
        ageEligible = true;
        score += 35;
        reasons.push(`Age ${userAge} falls within [${job.minAge} - ${maxAgeAllowed}] years (${profile.category} category relaxation +${relaxationYears} yrs).`);
      } else if (userAge < job.minAge) {
        warnings.push(`Under minimum age limit (Minimum age: ${job.minAge}, current age: ${userAge}).`);
      } else {
        warnings.push(`Exceeds maximum age limit of ${maxAgeAllowed} years for ${profile.category} category (Current age: ${userAge}).`);
      }

      // 2. Education Qualification
      let educationEligible = false;
      const userLevel = profile.educationLevel || 'B.Tech / B.E.';
      const jobEduLevels = job.educationRequired || [];
      
      const hierarchy = {
        '10th Pass': 1,
        '12th Pass': 2,
        'Diploma / ITI': 3,
        "Bachelor's Degree": 4,
        'B.Tech / B.E.': 4,
        "Master's Degree": 5,
        'PhD / Doctorate': 6
      };

      const userRank = hierarchy[userLevel] || 4;
      const minRequiredRank = Math.min(...jobEduLevels.map(lvl => hierarchy[lvl] || 1));

      if (userRank >= minRequiredRank) {
        educationEligible = true;
        score += 40;
        reasons.push(`Educational qualification (${userLevel}) satisfies or exceeds notification requirement (${jobEduLevels.join(' / ')}).`);
      } else {
        warnings.push(`Requires minimum qualification of ${jobEduLevels.join(' or ')}. Your profile indicates ${userLevel}.`);
      }

      // 3. Experience Match
      let expEligible = true;
      const reqExp = job.experienceRequiredYears || 0;
      const userExp = profile.experienceYears || 0;
      if (userExp >= reqExp) {
        score += 15;
        reasons.push(reqExp === 0 ? 'Freshers eligible - no prior government experience mandatory.' : `Experience of ${userExp} year(s) meets requirement of ${reqExp} year(s).`);
      } else {
        expEligible = false;
        warnings.push(`Requires ${reqExp} year(s) of experience. Profile has ${userExp} year(s).`);
      }

      // 4. Sector / Domain Synergy
      if (profile.preferredSectors?.includes(job.sector)) {
        score += 10;
        reasons.push(`Direct alignment with your preferred career track in ${job.sector} sector.`);
      }

      const isEligible = ageEligible && educationEligible && expEligible;
      const matchPercentage = Math.min(100, Math.max(score, isEligible ? 75 : 30));

      return {
        isEligible,
        matchPercentage,
        status: isEligible ? 'Eligible' : matchPercentage >= 50 ? 'Partially Eligible' : 'Not Eligible',
        reasons,
        warnings,
        maxAgeAllowed,
        ageRelaxationYears: relaxationYears
      };
    }

                          </div>
                          <p className="text-slate-400">{s.topics.join(' • ')}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      onClick={() => {
                        toggleSaveJob(selectedJob.id);
                        setSelectedJob(null);
                      }}
                      className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold"
                    >
                      {savedJobIds.includes(selectedJob.id) ? 'Saved ★' : 'Save Job ☆'}
                    </button>
                    <a
                      href={selectedJob.officialApplicationUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all shadow-md shadow-blue-600/20"
                    >
                      Open Official Application Portal ↗
                    </a>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 px-4 py-6 text-center text-xs text-slate-500">
            <p>GovCareer India • Self-contained Single-File Application • Accessible offline with zero build steps.</p>
          </footer>
        </div>
      );
    }

    // Mount to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
