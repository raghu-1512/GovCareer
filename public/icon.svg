<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Emblem Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M 256 90 L 370 145 C 370 265 295 365 256 405 C 217 365 142 265 142 145 Z" fill="url(#accentGrad)" filter="url(#shadow)" opacity="0.95" />
  
  <!-- Inner Shield Highlight -->
  <path d="M 256 112 L 350 157 C 350 255 288 340 256 376 C 224 340 162 255 162 157 Z" fill="#0f172a" />

  <!-- Government Column / Pillars -->
  <!-- Pediment (Top Triangle) -->
  <path d="M 205 195 L 256 160 L 307 195 Z" fill="url(#goldGrad)" />
  <rect x="200" y="195" width="112" height="8" rx="2" fill="url(#goldGrad)" />

  <!-- 3 Pillars -->
  <rect x="210" y="209" width="14" height="60" rx="3" fill="#ffffff" opacity="0.9" />
  <rect x="249" y="209" width="14" height="60" rx="3" fill="#ffffff" opacity="0.9" />
  <rect x="288" y="209" width="14" height="60" rx="3" fill="#ffffff" opacity="0.9" />

  <!-- Base Steps -->
  <rect x="195" y="274" width="122" height="8" rx="2" fill="url(#goldGrad)" />
  <rect x="185" y="286" width="142" height="10" rx="3" fill="url(#goldGrad)" />

  <!-- AI Sparkle / Star at center -->
  <path d="M 256 312 L 261 328 L 277 333 L 261 338 L 256 354 L 251 338 L 235 333 L 251 328 Z" fill="#38bdf8" />
  <circle cx="256" cy="333" r="3" fill="#ffffff" />
</svg>
