<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>GovCareer AI - Government Jobs, Eligibility & Exam Preparation</title>
    <meta name="description" content="AI-Powered Government Job Career Platform with real-time eligibility checking, syllabus analysis, and official application tracking." />
    
    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GovCareer" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="GovCareer AI - Government Jobs & Exam Prep" />
    <meta property="og:description" content="AI-Powered Government Job Career Platform with real-time eligibility checking, syllabus analysis, and official application tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GovCareer AI - Government Jobs & Exam Prep" />
    <meta name="twitter:description" content="AI-Powered Government Job Career Platform with real-time eligibility checking, syllabus analysis, and official application tracking." />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('GovCareer Service Worker registered:', reg.scope))
            .catch(err => console.warn('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
