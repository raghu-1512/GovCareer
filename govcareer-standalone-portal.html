    // --- ELIGIBILITY ENGINE ---
    function evaluateEligibility(profile, job) {
      let score = 0;
      const reasons = [];
      const warnings = [];

      let userAge = 24;
      if (profile.dateOfBirth) {
        const birthDate = new Date(profile.dateOfBirth);
        const refDate = new Date('2026-08-01');
        let calculatedAge = refDate.getFullYear() - birthDate.getFullYear();
        const m = refDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && refDate.getDate() < birthDate.getDate())) {
          calculatedAge--;
        }
        userAge = calculatedAge;
      }

      let maxAgeAllowed = job.maxAge;
      let relaxationYears = 0;
      if (profile.category === 'OBC') relaxationYears = job.ageRelaxation?.obc || 3;
      else if (profile.category === 'SC' || profile.category === 'ST') relaxationYears = job.ageRelaxation?.scSt || 5;
      else if (profile.category === 'PwD') relaxationYears = job.ageRelaxation?.pwd || 10;
      maxAgeAllowed += relaxationYears;

      let ageEligible = false;
      if (userAge >= job.minAge && userAge <= maxAgeAllowed) {
        ageEligible = true;
        score += 35;
        reasons.push(`Age ${userAge} falls within [${job.minAge} - ${maxAgeAllowed}] years (${profile.category} relaxation +${relaxationYears} yrs).`);
      } else {
        warnings.push(`Exceeds maximum age limit of ${maxAgeAllowed} years for ${profile.category} category.`);
      }

      const hierarchy = {
        '10th Pass': 1,
        '12th Pass': 2,
        'Diploma / ITI': 3,
        "Bachelor's Degree": 4,
        'B.Tech / B.E.': 4,
        "Master's Degree": 5
      };

      const userRank = hierarchy[profile.educationLevel] || 4;
      const minRequiredRank = Math.min(...job.educationRequired.map(lvl => hierarchy[lvl] || 1));

      let educationEligible = false;
      if (userRank >= minRequiredRank) {
        educationEligible = true;
        score += 40;
        reasons.push(`Educational qualification (${profile.educationLevel}) satisfies notification requirement (${job.educationRequired.join(' / ')}).`);
      } else {
        warnings.push(`Requires minimum qualification of ${job.educationRequired.join(' or ')}.`);
      }

      score += 25;
      const isEligible = ageEligible && educationEligible;
      const matchPercentage = Math.min(100, Math.max(score, isEligible ? 85 : 30));

      return {
        isEligible,
        matchPercentage,
        status: isEligible ? 'Eligible' : 'Not Eligible',
        reasons,
        warnings,
        maxAgeAllowed
      };
    }

                            </div>
                            <div className="flex justify-between">
                              <span className="text-slate-400">Deadline:</span>
                              <span className="text-amber-400 font-semibold">{job.applicationDeadline}</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                          <button
                            onClick={() => setSelectedJob(job)}
                            className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all shadow"
                          >
                            View Details & Syllabus
                          </button>
                          <a
                            href={job.officialApplicationUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700"
                          >
                            Apply Official ↗
                          </a>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TRACKER VIEW */}
            {tab === 'tracker' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-white">Application Tracker Console</h2>
                  <button
                    onClick={() => {
                      const newApp = {
                        id: `app-${Date.now()}`,
                        jobTitle: 'SSC CGL 2026',
                        organization: 'Staff Selection Commission',
                        status: 'Applied',
                        registrationNumber: 'SSC-2026-99120',
                        examDate: '2026-10-18',
                        notes: 'Applied online. Mock tests in progress.'
                      };
                      setApplications(prev => [newApp, ...prev]);
                    }}
                    className="px-3.5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold"
                  >
                    + Add Application
                  </button>
                </div>

                <div className="space-y-4">
                  {applications.map(a => (
                    <div key={a.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-xs font-bold text-blue-400">{a.organization}</span>
                          <h3 className="text-base font-bold text-white">{a.jobTitle}</h3>
                        </div>
                        <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-500/30">
                          {a.status}
                        </span>
                      </div>

                      <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs grid grid-cols-2 gap-2">
                        <div>
                          <span className="text-slate-400">Reg No: </span>
                          <span className="text-white font-mono">{a.registrationNumber}</span>
                        </div>
                        <div>
                          <span className="text-slate-400">Exam Date: </span>
                          <span className="text-amber-400 font-semibold">{a.examDate}</span>
                        </div>
                      </div>

                      <p className="text-xs text-slate-300">Notes: {a.notes}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CALENDAR VIEW */}
            {tab === 'calendar' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold text-white">2026 Government Exam Schedule</h2>
                {EXAMS_LIST.map(e => (
                  <div key={e.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 uppercase">{e.category}</span>
                      <h3 className="text-base font-bold text-white mt-1">{e.title}</h3>
                      <p className="text-xs text-slate-400 mt-0.5">{e.syllabusOverview}</p>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 block">Exam Date</span>
                      <span className="text-base font-extrabold text-amber-400">{e.examDate}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* MENTOR VIEW */}
            {tab === 'mentor' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 h-[600px] flex flex-col shadow-2xl">
                <h2 className="text-base font-bold text-white pb-3 border-b border-slate-800">AI Career Mentor</h2>
                <div className="flex-1 overflow-y-auto py-4 space-y-3">
                  {chatMessages.map((m, i) => (
                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl p-4 text-xs whitespace-pre-wrap ${m.role === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-950 text-slate-200 border border-slate-800'}`}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>
                <form onSubmit={handleChatSubmit} className="flex gap-2 pt-3 border-t border-slate-800">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask a question about government exam preparation..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                  />
                  <button type="submit" className="px-4 py-2.5 rounded-2xl bg-blue-600 text-white text-xs font-bold">
                    Send
                  </button>
                </form>
              </div>
            )}

            {/* PROFILE VIEW */}
            {tab === 'profile' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xl mx-auto space-y-4">
                <h2 className="text-xl font-bold text-white">Candidate Profile</h2>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Name</label>
                    <input
                      type="text"
                      value={profile.name}
                      onChange={(e) => setProfile(p => ({ ...p, name: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Category</label>
                    <select
                      value={profile.category}
                      onChange={(e) => setProfile(p => ({ ...p, category: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none"
                    >
                      <option value="General">General / UR</option>
                      <option value="OBC">OBC (+3 Yrs)</option>
                      <option value="SC">SC (+5 Yrs)</option>
                      <option value="ST">ST (+5 Yrs)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Education</label>
                    <select
                      value={profile.educationLevel}
                      onChange={(e) => setProfile(p => ({ ...p, educationLevel: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none"
                    >
                      <option value="10th Pass">10th Pass</option>
                      <option value="12th Pass">12th Pass</option>
                      <option value="Bachelor's Degree">Bachelor's Degree</option>
                      <option value="B.Tech / B.E.">B.Tech / B.E.</option>
                    </select>
                  </div>
                  <button
                    onClick={() => {
                      alert('Profile saved!');
                      navigateTo('search');
                    }}
                    className="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs"
                  >
                    Save & Update Matches
                  </button>
                </div>
              </div>
            )}

            {/* MODAL */}
            {selectedJob && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xl w-full space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center">
                    <button onClick={() => setSelectedJob(null)} className="text-xs bg-slate-800 px-3 py-1.5 rounded-xl text-slate-200">← Back</button>
                    <button onClick={() => setSelectedJob(null)} className="text-slate-400">✕</button>
                  </div>
                  <h2 className="text-lg font-bold text-white">{selectedJob.title}</h2>
                  <p className="text-xs text-slate-300">{selectedJob.description}</p>
                  <div className="text-xs bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <strong className="text-white block mb-1">Syllabus Overview:</strong>
                    {selectedJob.syllabus.map((s, i) => (
                      <p key={i} className="text-slate-400">• {s.section} ({s.marks} Marks): {s.topics.join(', ')}</p>
                    ))}
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <a
                      href={selectedJob.officialApplicationUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold"
                    >
                      Apply on Official Portal ↗
                    </a>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
